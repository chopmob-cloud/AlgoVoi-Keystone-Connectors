[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-keystone-httpx"
version = "0.5.0"
description = "Bind outbound HTTP calls to the AlgoVoi keystone -- wrap any httpx.Client or requests.Session and every POST / PUT / PATCH / DELETE gets a content-addressed execution_ref (keystone-only edition, Apache-2.0)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["http", "httpx", "requests", "outbound", "webhook", "client", "keystone", "execution_ref", "jcs", "rfc8785", "algovoi"]
requires-python = ">=3.10"
dependencies = ["algovoi-execution-ref>=0.1.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://www.algovoi.co.uk"
Documentation = "https://algovoi.co.uk/docs/keystone-connectors"
Repository = "https://github.com/chopmob-cloud/AlgoVoi-Keystone-Connectors"
Issues = "https://github.com/chopmob-cloud/AlgoVoi-Keystone-Connectors/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["algovoi_keystone_httpx*"]

