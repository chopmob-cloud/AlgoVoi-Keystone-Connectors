name: release

# The only supported publish path for the connector family.
#
# Hand-built uploads are what left the 0.1.0 releases with 12 wheels and no
# sdist at all (so macOS and any non-glibc platform had nothing to install).
# This workflow builds CPython 3.10-3.13 for manylinux x86_64 + aarch64 and
# Windows amd64, builds an sdist for everything else, and publishes on a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (otherwise build only)"
        type: boolean
        default: false

env:
  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
  CIBW_SKIP: "*-musllinux* *_i686 *-win32 pp*"
  CIBW_ARCHS_LINUX: "x86_64 aarch64"

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          pkgs=$(ls -d keystone-* | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix={\"package\":$pkgs}" >> "$GITHUB_OUTPUT"
          echo "$pkgs"

  wheels:
    needs: packages
    name: wheels ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.matrix).package }}
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip cibuildwheel build
      - name: Enable QEMU (aarch64 manylinux under emulation)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse ${{ matrix.package }}
      - name: Build sdist (linux job only, once per package)
        if: runner.os == 'Linux'
        run: python -m build --sdist --outdir wheelhouse ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.package }}-${{ runner.os }}
          path: wheelhouse/*

  tests:
    needs: packages
    name: tests ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.matrix).package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the built package, then run its test suite from a neutral cwd
        run: |
          python -m pip install --upgrade pip pytest algovoi-execution-ref
          python -m pip install --no-deps ./${{ matrix.package }}
          # run from outside the source tree, otherwise the un-compiled local
          # package dir shadows the installed wheel and collection fails
          work=$(mktemp -d)
          cp -r "$GITHUB_WORKSPACE/${{ matrix.package }}/tests" "$work/"
          cd "$work"
          python -m pytest tests -q

  publish:
    needs: [wheels, tests]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: List what will be uploaded
        run: ls -la dist
      # Token-based for now. Preferred long-term is PyPI trusted publishing:
      # add a pending publisher for this repo + workflow on PyPI, then swap
      # this step for `id-token: write` + gh-action-pypi-publish with no password.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
