name: release

# The only supported publish path for the connector family.
#
# Hand-built uploads are what left the 0.1.0 releases with 12 wheels and no
# sdist at all (so macOS and any non-glibc platform had nothing to install).
#
# Since 0.5.0 these packages are pure Python: the adapters were Cython-compiled
# for obfuscation only, and every .pyx was already valid Python. There is
# nothing platform-specific to build, so one py3-none-any wheel plus an sdist
# installs everywhere, and cibuildwheel would only emit four identical wheels
# per package. Build once, then assert the wheel really is universal.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (otherwise build only)"
        type: boolean
        default: false

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          pkgs=$(ls -d keystone-* | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix={\"package\":$pkgs}" >> "$GITHUB_OUTPUT"
          echo "$pkgs"

  build:
    needs: packages
    name: build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.matrix).package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel + sdist
        run: python -m build --wheel --sdist --outdir wheelhouse ${{ matrix.package }}
      - name: Assert the wheel is universal and the sdist exists
        run: |
          set -euo pipefail
          ls -la wheelhouse
          for w in wheelhouse/*.whl; do
            case "$w" in
              *-py3-none-any.whl) ;;
              *) echo "::error::$w is not a py3-none-any wheel - did Cython come back?"; exit 1 ;;
            esac
          done
          ls wheelhouse/*.tar.gz > /dev/null || { echo "::error::no sdist produced"; exit 1; }
          python -m twine check wheelhouse/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: wheelhouse/*

  tests:
    needs: packages
    name: tests ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.matrix).package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the built package, then run its test suite from a neutral cwd
        run: |
          python -m pip install --upgrade pip pytest algovoi-execution-ref
          python -m pip install --no-deps ./${{ matrix.package }}
          # run from outside the source tree, otherwise the local package dir
          # shadows the installed wheel and collection fails
          work=$(mktemp -d)
          cp -r "$GITHUB_WORKSPACE/${{ matrix.package }}/tests" "$work/"
          cd "$work"
          python -m pytest tests -q

  publish:
    needs: [build, tests]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: List what will be uploaded
        run: ls -la dist
      # Token-based for now. Preferred long-term is PyPI trusted publishing:
      # add a pending publisher for this repo + workflow on PyPI, then swap
      # this step for `id-token: write` + gh-action-pypi-publish with no password.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
