[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-keystone-azure-blob"
version = "0.5.0"
description = "Bind Azure Blob Storage writes to the AlgoVoi keystone -- wrap any azure-storage-blob ContainerClient and every upload / delete gets a content-addressed execution_ref (keystone-only edition, Apache-2.0)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["azure", "azure-blob", "blob-storage", "object-storage", "keystone", "execution_ref", "jcs", "rfc8785", "algovoi"]
requires-python = ">=3.10"
dependencies = ["algovoi-execution-ref>=0.1.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving",
]

[project.urls]
Homepage = "https://docs.algovoi.co.uk/keystone"
Documentation = "https://docs.algovoi.co.uk/keystone"
Repository = "https://github.com/chopmob-cloud/AlgoVoi-Keystone-Connectors"
Issues = "https://github.com/chopmob-cloud/AlgoVoi-Keystone-Connectors/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["algovoi_keystone_azure_blob*"]

