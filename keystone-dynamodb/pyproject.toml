[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovoi-keystone-dynamodb"
version = "0.5.0"
description = "Bind AWS DynamoDB writes to the AlgoVoi keystone -- wrap any boto3 DynamoDB client and every put / update / delete gets a content-addressed execution_ref (keystone-only edition, Apache-2.0)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["aws", "dynamodb", "nosql", "database", "boto3", "keystone", "execution_ref", "jcs", "rfc8785", "algovoi"]
requires-python = ">=3.10"
dependencies = ["algovoi-execution-ref>=0.1.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://www.algovoi.co.uk"
Documentation = "https://algovoi.co.uk/docs/keystone-connectors"
Repository = "https://github.com/chopmob-cloud/AlgoVoi-Keystone-Connectors"
Issues = "https://github.com/chopmob-cloud/AlgoVoi-Keystone-Connectors/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["algovoi_keystone_dynamodb*"]

